# HOME 첫 화면
hero:
  headline: |-
    더 나은 배터리, 
    여기서 함께 만듭니다.
  intro: >-
    에너지 디바이스 제조 연구실은 이차전지 제조 공정을 근본부터 다시 설계합니다.
    용매 없는 건식 후막 전극, 기존 공정으로는 만들 수 없던 크기와 형태의 프린팅 전지,
    그리고 AI 기반 공정·성능 분석으로 현재 배터리 기술의 한계를 돌파합니다.

